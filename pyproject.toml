[project]
name = "notas-fiscais-ia"
version = "1.0.0"
description = "Extração de notas fiscais com IA (Gemini), medida contra um gabarito e comparada com regras."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bruno Araújo Sakamoto" }]
dependencies = [
    "google-genai>=2.31,<3",
    "pydantic>=2.10,<3",
    "duckdb>=1.4,<2",
    "pdfplumber>=0.11,<1",
    "reportlab>=4.2,<6",
    "pypdfium2>=4.30,<6",
    "pillow>=11,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["notas", "notas.extratores"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# tabelas de dados fictícios e o modelo HTML ficam mais legíveis numa linha só
"notas/gerador.py" = ["E501"]
"notas/relatorio.py" = ["E501"]
